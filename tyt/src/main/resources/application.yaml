spring:
  application:
    name: tyt
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:tyt
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

kakao:
  app-id: ${KAKAO_APP_ID}
  # 서버에서만 쓰는 비밀값. 탈퇴할 때 카카오 연결 끊기에 쓴다
  admin-key: ${KAKAO_ADMIN_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

# 스펙 출력 순서를 고정한다. OpenApiSpecTest의 불일치 검사가 매번 같은 결과를 내려면 필요하다
springdoc:
  writer-with-order-by-keys: true
  # 기본값 */*이면 성공 응답의 미디어 타입이 */*로 문서화된다
  default-produces-media-type: application/json
