spring:
  application:
    name: tyt
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:tyt
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

kakao:
  app-id: ${KAKAO_APP_ID}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d
